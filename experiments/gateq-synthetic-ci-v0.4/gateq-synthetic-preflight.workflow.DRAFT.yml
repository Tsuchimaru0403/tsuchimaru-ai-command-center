# DRAFT ONLY — NOT A PROTECTION REQUIRED CHECK OR TRUSTED GATE Q VERIFIER.
# Action refs are pinned to exact GitHub v4.2.2/v5.6.0 tag commits; DRAFT ONLY.
name: Gate Q Synthetic Fixture Tests - NOT A REQUIRED CHECK (DRAFT)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gateq-synthetic-demo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-fixture-tests-not-required:
    name: synthetic-fixture-tests-NOT-REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run synthetic-only regression tests (no Gate Q candidate)
        run: python -m unittest discover -v -p 'test_*.py'
