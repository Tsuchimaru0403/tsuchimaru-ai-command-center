name: Gate Q Windows Path Qualifier v0.5 toolchain layout discovery

on:
  push:
    branches:
      - gateq-windows-path-qualifier-v05-remediation-20261002

permissions:
  contents: read

jobs:
  discover-swift-toolchain:
    name: Read-only layout discovery in pinned Swift image
    runs-on: ubuntu-22.04
    steps:
      - name: Discover tools and compare pinned versions
        shell: bash
        run: |
          set -euo pipefail
          image='swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791'
          expected_clang='clang version 17.0.0 (https://github.com/swiftlang/llvm-project.git 10999b6d034fe318f3d56c83bddb6572593a8bb0)'
          expected_lld='LLD 17.0.0 (https://github.com/swiftlang/llvm-project.git 10999b6d034fe318f3d56c83bddb6572593a8bb0)'
          docker run --platform linux/amd64 --pull=always --rm \
            -e EXPECTED_CLANG="$expected_clang" -e EXPECTED_LLD="$expected_lld" \
            "$image" bash -lc '
              set -uo pipefail
              printf "=== command -v ===\\n"
              for tool in swift swiftc clang clang-17 clang-19 lld-link ld.lld; do
                if path=$(command -v "$tool" 2>/dev/null); then printf "%s=%s\\n" "$tool" "$path"; else printf "%s=NOT_FOUND\\n" "$tool"; fi
              done
              printf "=== versions ===\\n"
              for tool in swift swiftc; do
                if path=$(command -v "$tool" 2>/dev/null); then "$path" --version 2>&1 || true; else printf "%s unavailable\\n" "$tool"; fi
              done
              printf "=== PATH-related environment ===\\n"
              env | sort | grep -E "^(PATH|SWIFT_VERSION|SWIFT_BRANCH|SWIFT_PLATFORM|LD_LIBRARY_PATH)=" || true
              printf "=== /usr/local ===\\n"
              ls -la /usr/local 2>&1 || true
              printf "=== /usr/local/swift (when present) ===\\n"
              if test -e /usr/local/swift; then ls -la /usr/local/swift 2>&1; else printf "/usr/local/swift=NOT_FOUND\\n"; fi
              printf "=== bounded candidate paths (depth <= 7; first 80) ===\\n"
              find /usr /opt /usr/local -maxdepth 7 -type f \( -name clang -o -name clang-17 -o -name clang-19 -o -name lld-link -o -name ld.lld -o -name swiftc \) -print 2>/dev/null | head -n 80 || true
              mapfile -t clangs < <({ for t in clang clang-17 clang-19; do command -v "$t" 2>/dev/null || true; done; find /usr /opt /usr/local -maxdepth 7 -type f \( -name clang -o -name clang-17 -o -name clang-19 \) -print 2>/dev/null; } | sort -u | head -n 80)
              mapfile -t llds < <({ command -v lld-link 2>/dev/null || true; find /usr /opt /usr/local -maxdepth 7 -type f -name lld-link -print 2>/dev/null; } | sort -u | head -n 80)
              clang_match=0
              lld_match=0
              printf "=== candidate Clang versions ===\\n"
              for candidate in "${clangs[@]}"; do
                test -x "$candidate" || continue
                line=$("$candidate" --version 2>&1 | head -n 1 || true)
                printf "clang_candidate=%s\\nversion=%s\\n" "$candidate" "$line"
                if test "$line" = "$EXPECTED_CLANG"; then clang_match=1; fi
              done
              printf "=== candidate LLD versions ===\\n"
              for candidate in "${llds[@]}"; do
                test -x "$candidate" || continue
                line=$("$candidate" --version 2>&1 | head -n 1 || true)
                printf "lld_link_candidate=%s\\nversion=%s\\n" "$candidate" "$line"
                if test "$line" = "$EXPECTED_LLD"; then lld_match=1; fi
              done
              printf "=== decision ===\\n"
              if test "$clang_match" -eq 1 && test "$lld_match" -eq 1; then
                printf "EXACT_VERSION_MATCH: eligible for separately authorized remediation build steps.\\n"
              else
                printf "FAIL_CLOSED: required Clang and LLD exact version strings were not both found.\\n"
                exit 1
              fi
            '

  build-v05:
    name: v0.5 fresh A/B build and package
    needs: discover-swift-toolchain
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      LLVM_SOURCE_COMMIT: 10999b6d034fe318f3d56c83bddb6572593a8bb0
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - name: Resolve current Actions job ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_JOB_ID="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" | jq -r '[.jobs[] | select(.status == "in_progress")][0].id')"
          test -n "$GITHUB_JOB_ID" -a "$GITHUB_JOB_ID" != null
          echo "GITHUB_JOB_ID=$GITHUB_JOB_ID" >> "$GITHUB_ENV"
      - name: Run v0.5 build inside exact pinned Swift image
        shell: bash
        run: |
          set -euo pipefail
          image='swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791'
          docker run --platform linux/amd64 --pull=always --rm \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=$RUNNER_TEMP" \
            --mount "type=bind,src=/opt/hostedtoolcache/Python/3.13.5/x64,dst=/opt/hostedtoolcache/Python/3.13.5/x64,readonly" \
            -e GITHUB_WORKSPACE -e RUNNER_TEMP -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_JOB_ID -e LLVM_SOURCE_COMMIT \
            "$image" bash -lc 'cd "$GITHUB_WORKSPACE" && bash -x gateq/windows-path-qualifier/v0.5-remediation/build_v05.sh'
      - name: Upload v0.5 package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gateq-windows-path-qualifier-v0.5
          path: |
            ${{ runner.temp }}/gateq-v05/gateq-windows-path-qualifier-v0.5.zip
            ${{ runner.temp }}/gateq-v05/gateq-windows-path-qualifier-v0.5.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/gateq-v05/gateq-windows-path-qualifier-v0.5.zip"
          SIZE="$(stat -c %s "$PACKAGE")"
          {
            echo "## Gate Q v0.5 package"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Job ID: $GITHUB_JOB_ID"
            echo "- Head commit: $GITHUB_SHA"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Artifact size: $SIZE bytes"
            echo "- GitHub artifact digest: $ARTIFACT_DIGEST"
            echo "- Artifact URL: $ARTIFACT_URL"
            echo "- Note: artifact identity and digest are recorded here after upload; the package cannot contain its own final digest."
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$PACKAGE" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, pathlib, sys, zipfile
          package=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(package) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f"canonical ZIP CRC failure: {bad}")
              names=z.namelist()
              manifest=next(n for n in names if n.endswith('/FILES.sha256'))
              entries=[n for n in names if not n.endswith('/')]
              rows=z.read(manifest).decode('utf-8').splitlines()
              payloads={}
              for row in rows:
                  digest, name=row.split('  ',1)
                  payloads[name]=digest
              mismatches=[]
              for name,digest in payloads.items():
                  matches=[entry for entry in names if entry.endswith('/'+name)]
                  if len(matches)!=1 or hashlib.sha256(z.read(matches[0])).hexdigest()!=digest:
                      mismatches.append(name)
              if mismatches: raise SystemExit(f"FILES.sha256 mismatch: {mismatches}")
              keyfile=next(n for n in names if n.endswith('/evidence/KEY_SHA256.txt'))
              keys=dict(line.split('=',1) for line in z.read(keyfile).decode().splitlines() if '=' in line)
              toolchain=next(n for n in names if n.endswith('/evidence/TOOLCHAIN_INSTALLATION.txt'))
              toolchain_text=z.read(toolchain).decode()
              assert 'clang_path=/usr/bin/clang' in toolchain_text
              assert 'lld_link_path=/usr/bin/lld-link' in toolchain_text
              assert 'no swiftlang/llvm-project source build was performed' in toolchain_text
              print()
              print('### Canonical package verification')
              print()
              print(f"- Canonical ZIP SHA-256: {hashlib.sha256(package.read_bytes()).hexdigest()} ({package.stat().st_size} bytes)")
              print(f"- ZIP entries: {len(entries)}")
              print(f"- FILES.sha256 payload count: {len(rows)}")
              print(f"- A/B PE SHA-256: {keys.get('PE_A')} / {keys.get('PE_B')}")
              print(f"- A/B normalized COFF SHA-256: {keys.get('normalized_COFF_A')} / {keys.get('normalized_COFF_B')}")
              def payload_hash(suffix):
                  entry=next(n for n in names if n.endswith(suffix))
                  return hashlib.sha256(z.read(entry)).hexdigest()
              print(f"- Import library A/B SHA-256: kernel32={payload_hash('/bin/A/kernel32.lib')} / {payload_hash('/bin/B/kernel32.lib')}; ntdll={payload_hash('/bin/A/ntdll.lib')} / {payload_hash('/bin/B/ntdll.lib')}")
              print(f"- FILES.sha256 verification: {len(rows)}/{len(payloads)} payloads PASS; ZIP CRC PASS")
              print(f"- Toolchain fact check: pinned image, linux/amd64, /usr/bin/clang, /usr/bin/lld-link; no source build")
          PY
