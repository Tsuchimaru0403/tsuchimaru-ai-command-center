name: Gate Q Windows Path Qualifier v0.5 toolchain layout discovery

on:
  push:
    branches:
      - gateq-windows-path-qualifier-v05-remediation-20261002

permissions:
  contents: read

jobs:
  discover-swift-toolchain:
    name: Read-only layout discovery in pinned Swift image
    runs-on: ubuntu-22.04
    steps:
      - name: Discover tools and compare pinned versions
        shell: bash
        run: |
          set -euo pipefail
          image='swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791'
          expected_clang='clang version 17.0.0 (https://github.com/swiftlang/llvm-project.git 10999b6d034fe318f3d56c83bddb6572593a8bb0)'
          expected_lld='LLD 17.0.0 (https://github.com/swiftlang/llvm-project.git 10999b6d034fe318f3d56c83bddb6572593a8bb0)'
          docker run --platform linux/amd64 --pull=always --rm             -e EXPECTED_CLANG="$expected_clang" -e EXPECTED_LLD="$expected_lld"             "$image" bash -lc '
              set -uo pipefail
              printf "=== command -v ===\\n"
              for tool in swift swiftc clang clang-17 clang-19 lld-link ld.lld; do
                if path=$(command -v "$tool" 2>/dev/null); then printf "%s=%s\\n" "$tool" "$path"; else printf "%s=NOT_FOUND\\n" "$tool"; fi
              done
              printf "=== versions ===\\n"
              for tool in swift swiftc; do
                if path=$(command -v "$tool" 2>/dev/null); then "$path" --version 2>&1 || true; else printf "%s unavailable\\n" "$tool"; fi
              done
              printf "=== PATH-related environment ===\\n"
              env | sort | grep -E "^(PATH|SWIFT_VERSION|SWIFT_BRANCH|SWIFT_PLATFORM|LD_LIBRARY_PATH)=" || true
              printf "=== /usr/local ===\\n"
              ls -la /usr/local 2>&1 || true
              printf "=== /usr/local/swift (when present) ===\\n"
              if test -e /usr/local/swift; then ls -la /usr/local/swift 2>&1; else printf "/usr/local/swift=NOT_FOUND\\n"; fi
              printf "=== bounded candidate paths (depth <= 7; first 80) ===\\n"
              find /usr /opt /usr/local -maxdepth 7 -type f \( -name clang -o -name clang-17 -o -name clang-19 -o -name lld-link -o -name ld.lld -o -name swiftc \) -print 2>/dev/null | head -n 80 || true
              mapfile -t clangs < <({ for t in clang clang-17 clang-19; do command -v "$t" 2>/dev/null || true; done; find /usr /opt /usr/local -maxdepth 7 -type f \( -name clang -o -name clang-17 -o -name clang-19 \) -print 2>/dev/null; } | sort -u | head -n 80)
              mapfile -t llds < <({ command -v lld-link 2>/dev/null || true; find /usr /opt /usr/local -maxdepth 7 -type f -name lld-link -print 2>/dev/null; } | sort -u | head -n 80)
              clang_match=0
              lld_match=0
              printf "=== candidate Clang versions ===\\n"
              for candidate in "${clangs[@]}"; do
                test -x "$candidate" || continue
                line=$("$candidate" --version 2>&1 | head -n 1 || true)
                printf "clang_candidate=%s\\nversion=%s\\n" "$candidate" "$line"
                if test "$line" = "$EXPECTED_CLANG"; then clang_match=1; fi
              done
              printf "=== candidate LLD versions ===\\n"
              for candidate in "${llds[@]}"; do
                test -x "$candidate" || continue
                line=$("$candidate" --version 2>&1 | head -n 1 || true)
                printf "lld_link_candidate=%s\\nversion=%s\\n" "$candidate" "$line"
                if test "$line" = "$EXPECTED_LLD"; then lld_match=1; fi
              done
              printf "=== decision ===\\n"
              if test "$clang_match" -eq 1 && test "$lld_match" -eq 1; then
                printf "EXACT_VERSION_MATCH: eligible for separately authorized remediation build steps.\\n"
              else
                printf "FAIL_CLOSED: required Clang and LLD exact version strings were not both found.\\n"
                exit 1
              fi
            '

  build-v05:
    name: v0.5 fresh A/B build and package
    needs: discover-swift-toolchain
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    env:
      LLVM_SOURCE_COMMIT: 10999b6d034fe318f3d56c83bddb6572593a8bb0
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13.5
      - name: Resolve current Actions job ID
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GITHUB_JOB_ID="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" | jq -r '[.jobs[] | select(.status == "in_progress")][0].id')"
          test -n "$GITHUB_JOB_ID" -a "$GITHUB_JOB_ID" != null
          echo "GITHUB_JOB_ID=$GITHUB_JOB_ID" >> "$GITHUB_ENV"
      - name: Prepare remediation driver
        shell: bash
        run: |
          set -euo pipefail
          python3 gateq/windows-path-qualifier/v0.5-remediation/prepare_f09_ordering_fix.py \
            gateq/windows-path-qualifier/v0.5-remediation/build_v05.sh \
            "$RUNNER_TEMP/build_v05_f09_stage.sh"
          python3 gateq/windows-path-qualifier/v0.5-remediation/prepare_result_output_fix.py \
            "$RUNNER_TEMP/build_v05_f09_stage.sh" \
            "$RUNNER_TEMP/build_v05_effective.sh"
          chmod +x "$RUNNER_TEMP/build_v05_effective.sh"
          grep -F 'inspect_raw' "$RUNNER_TEMP/build_v05_effective.sh" >/dev/null
          grep -F 'REPARSE_TAG_DRIFT' "$RUNNER_TEMP/build_v05_effective.sh" >/dev/null
          grep -F 'WRITE_FAILED' "$RUNNER_TEMP/build_v05_effective.sh" >/dev/null
          grep -F 'CURRENT_RUN_PREUPLOAD_CONTEXT_V1' "$RUNNER_TEMP/build_v05_effective.sh" >/dev/null
      - name: Run v0.5 build inside exact pinned Swift image
        shell: bash
        run: |
          set -euo pipefail
          image='swift:6.2.1-jammy@sha256:6e33c70a59180c9b518f67728538312975cb3891177d20215cd2e31bdfe70791'
          docker run --platform linux/amd64 --pull=always --rm             --mount "type=bind,src=$GITHUB_WORKSPACE,dst=$GITHUB_WORKSPACE,readonly"             --mount "type=bind,src=$RUNNER_TEMP,dst=$RUNNER_TEMP"             --mount "type=bind,src=/opt/hostedtoolcache/Python/3.13.5/x64,dst=/opt/hostedtoolcache/Python/3.13.5/x64,readonly"             -e GITHUB_WORKSPACE -e RUNNER_TEMP -e GITHUB_SHA -e GITHUB_RUN_ID -e GITHUB_JOB -e GITHUB_JOB_ID -e LLVM_SOURCE_COMMIT             "$image" bash -lc 'cd "$GITHUB_WORKSPACE" && bash -x "$RUNNER_TEMP/build_v05_effective.sh"'
      - name: Upload v0.5 package
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gateq-windows-path-qualifier-v0.5
          path: |
            ${{ runner.temp }}/gateq-v05/gateq-windows-path-qualifier-v0.5.zip
            ${{ runner.temp }}/gateq-v05/gateq-windows-path-qualifier-v0.5.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Create current-run primary artifact binding
        id: create_binding
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          PRIMARY_ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PRIMARY_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          BIND_DIR="$RUNNER_TEMP/gateq-v05-current-binding"
          rm -rf "$BIND_DIR"
          mkdir -p "$BIND_DIR"
          api_get_retry() {
            local url="$1" out="$2" attempts=12 delay=5 i
            rm -f "$out"
            for i in $(seq 1 "$attempts"); do
              code="$(curl -sS -L -o "$out.tmp" -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" "$url" || true)"
              if test "$code" = 200; then
                mv "$out.tmp" "$out"
                return 0
              fi
              rm -f "$out.tmp"
              echo "API visibility retry $i/$attempts: HTTP $code for $url" >&2
              sleep "$delay"
            done
            echo "API object did not become visible: $url" >&2
            return 1
          }
          api_get_retry \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$PRIMARY_ARTIFACT_ID" \
            "$BIND_DIR/PRIMARY_ARTIFACT_API_RESPONSE.json"
          api_get_retry \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$BIND_DIR/CURRENT_RUN_API_RESPONSE.json"
          api_get_retry \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            "$BIND_DIR/CURRENT_RUN_JOBS_API_RESPONSE.json"
          python3 - "$BIND_DIR" "$RUNNER_TEMP/gateq-v05/gateq-windows-path-qualifier-v0.5.zip" "$RUNNER_TEMP/gateq-v05/gateq-windows-path-qualifier-v0.5.zip.sha256" <<'PYBIND'
          import hashlib,json,os,pathlib,sys
          d=pathlib.Path(sys.argv[1]); package=pathlib.Path(sys.argv[2]); sidecar=pathlib.Path(sys.argv[3])
          art=json.loads((d/'PRIMARY_ARTIFACT_API_RESPONSE.json').read_text())
          run=json.loads((d/'CURRENT_RUN_API_RESPONSE.json').read_text())
          jobs=json.loads((d/'CURRENT_RUN_JOBS_API_RESPONSE.json').read_text())
          expected_id=int(os.environ['PRIMARY_ARTIFACT_ID'])
          upload_digest=os.environ['PRIMARY_ARTIFACT_DIGEST']
          expected_digest=upload_digest if upload_digest.startswith('sha256:') else 'sha256:'+upload_digest
          run_id=int(os.environ['GITHUB_RUN_ID']); job_id=int(os.environ['GITHUB_JOB_ID']); head=os.environ['GITHUB_SHA']
          if art.get('id')!=expected_id: raise SystemExit('primary artifact ID API mismatch')
          if art.get('digest')!=expected_digest: raise SystemExit(f"primary artifact digest API mismatch: api={art.get('digest')} upload={expected_digest}")
          if art.get('workflow_run',{}).get('id')!=run_id: raise SystemExit('primary artifact run binding mismatch')
          if art.get('workflow_run',{}).get('head_sha')!=head: raise SystemExit('primary artifact head binding mismatch')
          if run.get('id')!=run_id or run.get('head_sha')!=head: raise SystemExit('current run API identity mismatch')
          if not any(j.get('id')==job_id and j.get('run_id')==run_id for j in jobs.get('jobs',[])):
              raise SystemExit('current job API identity mismatch')
          canonical_sha=hashlib.sha256(package.read_bytes()).hexdigest()
          sidecar_value=sidecar.read_text().split()[0]
          if canonical_sha!=sidecar_value: raise SystemExit('canonical ZIP sidecar mismatch')
          binding={
            'schema':'TSUCHIMARU_CURRENT_RUN_ARTIFACT_BINDING_V1',
            'capture_phase':'post-primary-upload within the same GitHub Actions job',
            'repository':os.environ['GITHUB_REPOSITORY'],
            'workflow_path':'.github/workflows/gateq-windows-path-qualifier-v05.yml',
            'run_id':run_id,
            'job_id':job_id,
            'head_sha':head,
            'primary_artifact':{
              'id':art['id'],'name':art['name'],'size_in_bytes':art['size_in_bytes'],
              'digest':art['digest'],'api_url':art['url'],
              'archive_download_url':art['archive_download_url'],
              'upload_output_url':os.environ['PRIMARY_ARTIFACT_URL'],
              'upload_output_digest_raw':upload_digest,
              'upload_output_digest_normalized':expected_digest
            },
            'canonical_inner_zip':{
              'name':package.name,'size_in_bytes':package.stat().st_size,'sha256':canonical_sha
            },
            'sidecar_sha256_value':sidecar_value,
            'binding_artifact_name':'gateq-windows-path-qualifier-v0.5-current-run-binding',
            'self_reference_boundary':'The primary artifact cannot contain its own GitHub-assigned post-upload ID/digest. This binding is therefore generated after primary upload and uploaded separately.'
          }
          (d/'CURRENT_RUN_ARTIFACT_BINDING_V1.json').write_text(json.dumps(binding,indent=2)+'\n')
          PYBIND
      - name: Upload current-run binding artifact
        id: upload_binding
        uses: actions/upload-artifact@v4
        with:
          name: gateq-windows-path-qualifier-v0.5-current-run-binding
          path: ${{ runner.temp }}/gateq-v05-current-binding/
          if-no-files-found: error
          retention-days: 90
      - name: Record artifact metadata
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          BINDING_ARTIFACT_ID: ${{ steps.upload_binding.outputs.artifact-id }}
          BINDING_ARTIFACT_URL: ${{ steps.upload_binding.outputs.artifact-url }}
          BINDING_ARTIFACT_DIGEST: ${{ steps.upload_binding.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/gateq-v05/gateq-windows-path-qualifier-v0.5.zip"
          SIZE="$(stat -c %s "$PACKAGE")"
          {
            echo "## Gate Q v0.5 package"
            echo
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Job ID: $GITHUB_JOB_ID"
            echo "- Head commit: $GITHUB_SHA"
            echo "- Artifact ID: $ARTIFACT_ID"
            echo "- Artifact size: $SIZE bytes"
            echo "- GitHub artifact digest: $ARTIFACT_DIGEST"
            echo "- Artifact URL: $ARTIFACT_URL"
            echo "- Binding artifact ID: $BINDING_ARTIFACT_ID"
            echo "- Binding artifact digest: $BINDING_ARTIFACT_DIGEST"
            echo "- Binding artifact URL: $BINDING_ARTIFACT_URL"
            echo "- Note: the primary package cannot self-contain its post-upload GitHub identity; the separately uploaded current-run binding artifact records that identity."
          } >> "$GITHUB_STEP_SUMMARY"
          python3 - "$PACKAGE" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import hashlib, pathlib, sys, zipfile
          package=pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(package) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f"canonical ZIP CRC failure: {bad}")
              names=z.namelist()
              manifest=next(n for n in names if n.endswith('/FILES.sha256'))
              entries=[n for n in names if not n.endswith('/')]
              rows=z.read(manifest).decode('utf-8').splitlines()
              payloads={}
              for row in rows:
                  digest, name=row.split('  ',1)
                  payloads[name]=digest
              mismatches=[]
              for name,digest in payloads.items():
                  matches=[entry for entry in names if entry.endswith('/'+name)]
                  if len(matches)!=1 or hashlib.sha256(z.read(matches[0])).hexdigest()!=digest:
                      mismatches.append(name)
              if mismatches: raise SystemExit(f"FILES.sha256 mismatch: {mismatches}")
              keyfile=next(n for n in names if n.endswith('/evidence/KEY_SHA256.txt'))
              keys=dict(line.split('=',1) for line in z.read(keyfile).decode().splitlines() if '=' in line)
              toolchain=next(n for n in names if n.endswith('/evidence/TOOLCHAIN_INSTALLATION.txt'))
              toolchain_text=z.read(toolchain).decode()
              assert 'clang_path=/usr/bin/clang' in toolchain_text
              assert 'lld_link_path=/usr/bin/lld-link' in toolchain_text
              assert 'no swiftlang/llvm-project source build was performed' in toolchain_text
              order_test=next(n for n in names if n.endswith('/evidence/F09_REVALIDATION_ORDER_STATIC_TESTS.json'))
              import json
              order=json.loads(z.read(order_test))
              assert order['result']=='PASS'
              assert order['both_tag_and_attribute_drift_priority']=='REPARSE_TAG_DRIFT'
              print()
              print('### Canonical package verification')
              print()
              print(f"- Canonical ZIP SHA-256: {hashlib.sha256(package.read_bytes()).hexdigest()} ({package.stat().st_size} bytes)")
              print(f"- ZIP entries: {len(entries)}")
              print(f"- FILES.sha256 payload count: {len(rows)}")
              print(f"- A/B PE SHA-256: {keys.get('PE_A')} / {keys.get('PE_B')}")
              print(f"- A/B normalized COFF SHA-256: {keys.get('normalized_COFF_A')} / {keys.get('normalized_COFF_B')}")
              def payload_hash(suffix):
                  entry=next(n for n in names if n.endswith(suffix))
                  return hashlib.sha256(z.read(entry)).hexdigest()
              print(f"- Import library A/B SHA-256: kernel32={payload_hash('/bin/A/kernel32.lib')} / {payload_hash('/bin/B/kernel32.lib')}; ntdll={payload_hash('/bin/A/ntdll.lib')} / {payload_hash('/bin/B/ntdll.lib')}")
              print(f"- FILES.sha256 verification: {len(rows)}/{len(payloads)} payloads PASS; ZIP CRC PASS")
              print(f"- F-09 ordering static evidence: PASS; both-drift priority=REPARSE_TAG_DRIFT")
              print(f"- Toolchain fact check: pinned image, linux/amd64, /usr/bin/clang, /usr/bin/lld-link; no source build")
          PY
