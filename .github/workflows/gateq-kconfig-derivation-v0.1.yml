name: Gate Q Kconfig Derivation Only

on:
  push:
    branches:
      - gateq-kconfig-derivation-20261003

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: 14794180686c2fb6307fbe359c359bec765249f3
      SOURCE_TREE: 3b5ec33f7fd60f23d01064150f7c7020d2e6af99
      K0_CONFIG_SHA256: 4e1eb0e493bc9e1b8dba715084834119743eb509e6c43773ce6cd74e19cf1139
      QUALIFIED_FINAL_CONFIG_SHA256: c7882dfaa29493bd0247564f7a5c8870cef535c91bdef22811eaf1da0df9584a
      CC: gcc-13
      HOSTCC: gcc-13
      LC_ALL: C
      LANG: C
      TZ: UTC

    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout kernel source A
        uses: actions/checkout@v4
        with:
          repository: microsoft/WSL2-Linux-Kernel
          ref: ${{ env.SOURCE_COMMIT }}
          path: linux-A
          fetch-depth: 1

      - name: Checkout kernel source B
        uses: actions/checkout@v4
        with:
          repository: microsoft/WSL2-Linux-Kernel
          ref: ${{ env.SOURCE_COMMIT }}
          path: linux-B
          fetch-depth: 1

      - name: Run Kconfig derivation only
        shell: bash
        run: |
          set -euo pipefail
          chmod +x control/gateq/kconfig-derivation/v0.1/run.sh
          control/gateq/kconfig-derivation/v0.1/run.sh

      - name: Upload Kconfig derivation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gateq-kconfig-derivation-v0.1
          path: out/
          if-no-files-found: warn
          compression-level: 9
          retention-days: 30
