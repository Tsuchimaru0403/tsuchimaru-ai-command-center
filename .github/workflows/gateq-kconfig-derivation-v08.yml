name: Gate Q Kconfig Derivation Remediation v0.8

on:
  push:
    branches: [gateq-kconfig-derivation-v08-20261003]
    paths: [.github/workflows/gateq-kconfig-derivation-v08.yml]

permissions:
  contents: read
  actions: read

jobs:
  derive-config-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download exact qualified toolchain evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateq-oci-toolchain-qualification-v01
          path: /tmp/gateq-toolchain
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36947817583
      - name: Checkout exact source only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: microsoft/WSL2-Linux-Kernel
          ref: 14794180686c2fb6307fbe359c359bec765249f3
          path: _kconfig_source
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare unprivileged qualified-rootfs Kconfig execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          mkdir -p /tmp/gateq-kconfig-evidence /tmp/gateq-config-output /tmp/gateq-proot
          mv "$GITHUB_WORKSPACE/_kconfig_source" /tmp/gateq-kconfig-source
          cd /tmp/gateq-proot
          apt-get download proot libtalloc2
          for pkg in ./*.deb; do dpkg-deb -x "$pkg" .; done
          sha256sum ./*.deb ./usr/bin/proot > /tmp/gateq-kconfig-evidence/PROOT_LAUNCHER.sha256
          export LD_LIBRARY_PATH=/tmp/gateq-proot/usr/lib/x86_64-linux-gnu
          /tmp/gateq-proot/usr/bin/proot --version > /tmp/gateq-kconfig-evidence/PROOT_VERSION.txt
          cat > /tmp/gateq-kconfig-evidence/normalize_remote.py <<'PY_NORMALIZE'
          import pathlib, subprocess, json, os, hashlib, re, shutil
          ev=pathlib.Path('/evidence')
          src=pathlib.Path('/tmp/gateq-kconfig-source')
          out=pathlib.Path('/tmp/gateq-config-output')
          def sha(p):
              with open(p,'rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          def js(n,d):(ev/n).write_text(json.dumps(d,indent=2,sort_keys=True)+'\n')
          baseline=(src/'Microsoft/config-wsl').read_bytes()
          assert hashlib.sha256(baseline).hexdigest()=='4e1eb0e493bc9e1b8dba715084834119743eb509e6c43773ce6cd74e19cf1139'
          assert os.readlink(src/'Microsoft/config-wsl')=='../arch/x86/configs/config-wsl'
          modules=re.findall(rb'^(CONFIG_[A-Za-z0-9_]+)=m$',baseline,re.M)
          assert len(modules)==len(set(modules))==760
          legacy_modules=re.findall(rb'^(CONFIG_[A-Z0-9_]+)=m$',baseline,re.M)
          missed=sorted(set(modules)-set(legacy_modules))
          expected_missed={
              b'CONFIG_MT76x02_LIB',b'CONFIG_MT76x02_USB',b'CONFIG_MT792x_LIB',b'CONFIG_MT792x_USB',
              b'CONFIG_MT76x0_COMMON',b'CONFIG_MT76x0U',b'CONFIG_MT76x2_COMMON',b'CONFIG_MT76x2U'
          }
          assert len(legacy_modules)==752 and set(missed)==expected_missed
          js('V06_REGEX_GAP_REMEDIATION.json',{
              'status':'CLOSED_BY_CASE_CORRECT_ENUMERATION',
              'baseline_raw_m_count':len(modules),
              'v06_uppercase_regex_count':len(legacy_modules),
              'missed_count':len(missed),
              'missed_symbols':[x.decode() for x in missed],
              'cause':'v0.6 regex [A-Z0-9_] excluded lowercase x in valid Kconfig symbol names',
              'v0.8_regex':'[A-Za-z0-9_]+',
              'Gate_Q':'HOLD'
          })
          pre=re.sub(rb'^(CONFIG_[A-Za-z0-9_]+)=m$',rb'\1=y',baseline,flags=re.M)
          pre=re.sub(rb'^CONFIG_MODULES=y$',b'CONFIG_MODULES=n',pre,flags=re.M)
          pre_sha256=hashlib.sha256(pre).hexdigest()
          (ev/'K0_BASELINE.config').write_bytes(baseline)
          (ev/'K1_PRE_OLDDEFCONFIG.config').write_bytes(pre)
          (ev/'K1_M_SYMBOLS.txt').write_text(''.join(x.decode()+'\n' for x in modules))
          expected=json.loads(pathlib.Path('/usr/local/share/gateq/TOOL_VERSIONS.json').read_text())
          versions={}
          for tool in ['gcc','ld','as','make','bison','flex','pahole']:
              actual=subprocess.check_output([tool,'--version'],text=True,stderr=subprocess.STDOUT).splitlines()[0]
              assert actual==expected[tool+'_first_line'],(tool,actual,expected[tool+'_first_line'])
              p=pathlib.Path(shutil.which(tool)).resolve()
              versions[tool]={'first_line':actual,'path':str(p),'sha256':sha(p),'matches_qualified_image_identity':True}
          pahole_path=shutil.which('pahole')
          assert pahole_path, 'pahole missing from qualified rootfs PATH'
          pahole_resolved=str(pathlib.Path(pahole_path).resolve())
          assert pahole_resolved=='/usr/bin/pahole',pahole_resolved
          pahole_version=subprocess.check_output(['pahole','--version'],text=True,stderr=subprocess.STDOUT).splitlines()[0]
          assert pahole_version=='v1.25',pahole_version
          helper_path=subprocess.run([str(src/'scripts/pahole-version.sh'),'pahole'],cwd=src,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env=os.environ,check=False)
          helper_abs=subprocess.run([str(src/'scripts/pahole-version.sh'),'/usr/bin/pahole'],cwd=src,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,env=os.environ,check=False)
          assert helper_path.returncode==0 and helper_path.stdout.strip()=='125',{'rc':helper_path.returncode,'stdout':helper_path.stdout}
          assert helper_abs.returncode==0 and helper_abs.stdout.strip()=='125',{'rc':helper_abs.returncode,'stdout':helper_abs.stdout}
          gcc_plugin_dir=subprocess.check_output(['gcc','-print-file-name=plugin'],text=True).strip()
          plugin_header=pathlib.Path(gcc_plugin_dir)/'include/plugin-version.h'
          package_lock=(ev/'TOOLCHAIN_PACKAGE_LOCK.tsv').read_text()
          plugin_rows=[line for line in package_lock.splitlines() if 'plugin' in line.lower()]
          js('PAHOLE_GCC_CAPABILITY_EVIDENCE.json',{'execution_environment':'same verified qualified OCI rootfs under unprivileged PRoot as Kconfig normalization','pahole':{'command_v':pahole_path,'resolved_path':pahole_resolved,'version_first_line':pahole_version,'helper_path_output':helper_path.stdout.strip(),'helper_path_exit_code':helper_path.returncode,'helper_absolute_output':helper_abs.stdout.strip(),'helper_absolute_exit_code':helper_abs.returncode,'expected_kconfig_version_integer':125},'gcc_plugin':{'gcc_plugin_directory':gcc_plugin_dir,'plugin_version_header':str(plugin_header),'plugin_version_header_present':plugin_header.exists(),'package_lock_plugin_rows':plugin_rows,'requires_independent_disposition':True},'Docker_executed':False,'Buildah_executed':False,'privileged_initializer_executed':False,'kernel_build_authorized':False,'runtime_authorized':False})
          js('TOOLCHAIN_EFFECTIVE_IDENTITY.json',{'tools':versions,'qualified_tool_versions':expected,'environment':dict(os.environ),'mode':'unprivileged PRoot over verified qualified OCI rootfs; no Docker, Buildah, privileged initializer, kernel compile or runtime workload'})
          commands=[]
          def normalize(lane,data,result):
              d=out/lane;d.mkdir(parents=True)
              (d/'.config').write_bytes(data)
              command=['make','-C',str(src),'O='+str(d),'ARCH=x86','PAHOLE=/usr/bin/pahole','olddefconfig']
              for attempt in [1,2]:
                  r=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  (ev/(lane+'_OLDDEFCONFIG_'+str(attempt)+'.log')).write_text(r.stdout)
                  commands.append({'lane':lane,'iteration':attempt,'argv':command,'exit_code':r.returncode,'log':lane+'_OLDDEFCONFIG_'+str(attempt)+'.log'})
                  js('NORMALIZATION_COMMANDS.json',commands)
                  assert r.returncode==0,r.stdout[-3000:]
                  config=(d/'.config').read_bytes()
                  if attempt==1:(ev/result).write_bytes(config)
                  else:assert config==(ev/result).read_bytes(),'not a byte fixed point'
              # olddefconfig host helper objects are permitted; kernel objects are not.
              objects=[p.relative_to(d).as_posix() for p in d.rglob('*.o')]
              forbidden=[p for p in objects if not p.startswith('scripts/kconfig/')]
              artifacts=[p.relative_to(d).as_posix() for p in d.rglob('*') if p.is_file() and p.name in ['bzImage','vmlinux','System.map']]
              assert not forbidden and not artifacts,(forbidden,artifacts)
              return {'lane':lane,'config_sha256':sha(ev/result),'second_normalization_byte_identical':True,'host_kconfig_objects':objects,'kernel_objects':forbidden,'kernel_outputs':artifacts,'conf_binary_sha256':sha(d/'scripts/kconfig/conf')}
          # Normalize untouched K0 as a control: isolates source/toolchain default drift
          # from changes induced specifically by the approved module-free transformation.
          k0=normalize('K0_CONTROL',baseline,'K0_NORMALIZED_CONTROL.config')
          k1=normalize('K1',pre,'K1_POST_OLDDEFCONFIG.config')
          post=(ev/'K1_POST_OLDDEFCONFIG.config').read_bytes()
          assert not re.search(rb'^CONFIG_[A-Za-z0-9_]+=m$',post,re.M)
          assert b'CONFIG_MODULES=y' not in post
          required_btf=[b'CONFIG_PAHOLE_VERSION=125',b'CONFIG_DEBUG_INFO_BTF=y',b'CONFIG_PAHOLE_HAS_SPLIT_BTF=y',b'CONFIG_PAHOLE_HAS_LANG_EXCLUDE=y',b'CONFIG_PROBE_EVENTS_BTF_ARGS=y']
          missing_btf=[x.decode() for x in required_btf if x not in post]
          js('PAHOLE_BTF_NORMALIZED_ASSERTIONS.json',{'required':[x.decode() for x in required_btf],'missing':missing_btf,'pass':not missing_btf})
          assert not missing_btf,missing_btf
          js('NORMALIZATION_RESULT.json',{'status':'PASS_CONFIG_NORMALIZATION_ONLY','source_commit':'14794180686c2fb6307fbe359c359bec765249f3','source_tree':'3b5ec33f7fd60f23d01064150f7c7020d2e6af99','qualified_toolchain_run':36947817583,'toolchain_oci_manifest_digest':'sha256:2d8a55a5ec3bc314c60e0e606571fb8759bc5100d56686762766595028cce829','K0_control':k0,'K1':k1,'baseline_module_entries':len(modules),'v06_uppercase_regex_entries':len(legacy_modules),'v06_regex_gap_count':len(missed),'pre_config_sha256':pre_sha256,'final_module_entries':0,'Gate_Q':'HOLD','kernel_build_authorized':False,'runtime_authorized':False,'review_required':'K1 final acceptance and every dependency delta decision remain the local evidence review step.'})
          PY_NORMALIZE
          cat > /tmp/gateq-kconfig-evidence/prepare_rootfs.py <<'PY_PREPARE'
          import pathlib,json,hashlib,tarfile,subprocess,shutil,os
          tool=pathlib.Path('/tmp/gateq-toolchain')
          root=pathlib.Path('/tmp/gateq-rootfs');root.mkdir()
          ev=pathlib.Path('/tmp/gateq-kconfig-evidence');ev.mkdir(exist_ok=True)
          def sha(p):
              with open(p,'rb') as f:return hashlib.file_digest(f,'sha256').hexdigest()
          for line in (tool/'FILES.sha256').read_text().splitlines():
              h,name=line.split(None,1);p=tool/name.strip().lstrip('*')
              assert p.resolve().is_relative_to(tool.resolve())
              assert sha(p)==h,(name,h)
          assert (tool/'FINAL_OCI_DIGEST.txt').read_text().strip()=='sha256:2d8a55a5ec3bc314c60e0e606571fb8759bc5100d56686762766595028cce829'
          oci=tool/'oci-A';index=json.loads((oci/'index.json').read_text());desc=index['manifests'][0]
          assert len(index['manifests'])==1 and desc['digest']=='sha256:2d8a55a5ec3bc314c60e0e606571fb8759bc5100d56686762766595028cce829'
          def content(d):
              alg,h=d['digest'].split(':');assert alg=='sha256'
              p=oci/'blobs'/alg/h;assert p.stat().st_size==d['size'] and sha(p)==h
              return p
          manifest=json.loads(content(desc).read_text());config=json.loads(content(manifest['config']).read_text())
          assert config['architecture']=='amd64' and config['os']=='linux'
          layers=[]
          for layer,diffid in zip(manifest['layers'],config['rootfs']['diff_ids'],strict=True):
              p=content(layer)
              import gzip
              with open(p,'rb') as f:
                  header=f.read(2)
              opener=gzip.open if header==b'\x1f\x8b' else open
              with opener(p,'rb') as f:assert 'sha256:'+hashlib.file_digest(f,'sha256').hexdigest()==diffid
              with tarfile.open(p) as t:
                  members=t.getmembers()
                  for m in members:
                      name=pathlib.PurePosixPath(m.name)
                      assert not name.is_absolute() and '..' not in name.parts
                      target=root/m.name
                      if name.name.startswith('.wh.'):
                          if name.name=='.wh..wh..opq':
                              parent=target.parent
                              assert parent.resolve().is_relative_to(root.resolve())
                              if parent.exists():
                                  for child in parent.iterdir():
                                      if child.is_symlink() or child.is_file():child.unlink()
                                      elif child.is_dir():shutil.rmtree(child)
                          else:
                              victim=target.with_name(name.name[4:])
                              assert victim.parent.resolve().is_relative_to(root.resolve())
                              if victim.is_symlink() or victim.is_file():victim.unlink()
                              elif victim.is_dir():shutil.rmtree(victim)
                  safe=[m for m in members if not pathlib.PurePosixPath(m.name).name.startswith('.wh.') and not m.isdev() and not m.isfifo()]
                  # OCI layer names are verified above; preserve image symlink bytes and
                  # regular executable modes. No chown, xattr or ACL operation is issued.
                  t.extractall(root,members=safe,filter='fully_trusted')
              layers.append({'digest':layer['digest'],'size':layer['size'],'diff_id':diffid})
          for p in ['tmp/gateq-kconfig-source','tmp/gateq-config-output','evidence','tmp']:(root/p).mkdir(parents=True,exist_ok=True)
          (ev/'OCI_MATERIALIZATION.json').write_text(json.dumps({'status':'PASS','qualified_run':36947817583,'manifest_digest':desc['digest'],'layers':layers,'config_digest':manifest['config']['digest'],'image_env':config['config'].get('Env',[]),'Docker_executed':False,'Buildah_executed':False,'privileged_initializer_executed':False},indent=2)+'\n')
          for name in ['OCI_TOOLCHAIN_ATTESTATION_V1.json','OCI_A_B_COMPARISON.json','TOOLCHAIN_PACKAGE_LOCK.tsv','REPRODUCIBILITY_POLICY.json']:
              shutil.copy2(tool/name,ev/name)
          source=pathlib.Path('/tmp/gateq-kconfig-source')
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()=='14794180686c2fb6307fbe359c359bec765249f3'
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD^{tree}'],text=True).strip()=='3b5ec33f7fd60f23d01064150f7c7020d2e6af99'
          subprocess.run(['git','-C',str(source),'diff','--exit-code'],check=True)
          host_run={'github_run_id':os.environ['GITHUB_RUN_ID'],'github_sha':os.environ['GITHUB_SHA'],'runner_os':os.environ['RUNNER_OS'],'runner_image':os.environ.get('ImageOS'),'runner_image_version':os.environ.get('ImageVersion'),'source_commit':'14794180686c2fb6307fbe359c359bec765249f3','source_tree':'3b5ec33f7fd60f23d01064150f7c7020d2e6af99'}
          (ev/'ACTIONS_RUN_BINDING.json').write_text(json.dumps(host_run,indent=2)+'\n')
          image_env=config['config'].get('Env',[])
          cmd=['/tmp/gateq-proot/usr/bin/proot','-r',str(root),'-b','/dev','-b','/proc','-b',str(source)+':/tmp/gateq-kconfig-source','-b','/tmp/gateq-config-output:/tmp/gateq-config-output','-b',str(ev)+':/evidence','-w','/tmp/gateq-kconfig-source','/usr/bin/env','-i']
          cmd+=image_env+['ARCH=x86','SRCARCH=x86','KERNELVERSION=6.18.40.1','PWD=/tmp/gateq-kconfig-source','LD_LIBRARY_PATH=','/usr/bin/python3','/evidence/normalize_remote.py']
          subprocess.run(cmd,check=True)
          for line in (ev/'NORMALIZATION_COMMANDS.json').read_text().splitlines():pass
          subprocess.run(['git','-C',str(source),'diff','--exit-code'],check=True)
          (ev/'REMOTE_FILES.sha256').write_text(''.join(sha(p)+'  '+p.relative_to(ev).as_posix()+'\n' for p in sorted(ev.rglob('*')) if p.is_file() and p.name!='REMOTE_FILES.sha256'))
          import zipfile,base64
          transport=pathlib.Path('/tmp/gateq-kconfig-log-transport.zip')
          with zipfile.ZipFile(transport,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(ev.rglob('*')):
                  if p.is_file():z.write(p,p.relative_to(ev).as_posix())
          print('GATEQ_TRANSPORT_SHA256 '+sha(transport),flush=True)
          print('GATEQ_TRANSPORT_BASE64_BEGIN',flush=True)
          encoded=base64.b64encode(transport.read_bytes()).decode()
          for i in range(0,len(encoded),100):print(encoded[i:i+100],flush=True)
          print('GATEQ_TRANSPORT_BASE64_END',flush=True)
          PY_PREPARE
          python3 /tmp/gateq-kconfig-evidence/prepare_rootfs.py
      - name: Build canonical v0.8 re-audit packet
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PACKET'
          from pathlib import Path
          import hashlib, json, zipfile
          ev=Path('/tmp/gateq-kconfig-evidence')
          readme="# Gate Q Kconfig derivation v0.8 — Fresh Re-Audit packet\\n\\nState: derivation-only qualification evidence. Gate Q remains HOLD.\\n\\nv0.8 verifies in the same qualified OCI rootfs used for Kconfig normalization: /usr/bin/pahole resolution, pahole v1.25, scripts/pahole-version.sh=125 via PATH and absolute binding, PAHOLE=/usr/bin/pahole on all K0/K1 olddefconfig commands, normalized CONFIG_PAHOLE_VERSION=125 plus core BTF capability symbols, and GCC plugin directory/header/package-lock evidence.\\n\\nNo Docker, Buildah, privileged initializer, kernel build, runtime workload, Gate A, Stage 0B runtime, or production authorization."
          prompt="# Fresh Independent Re-Audit — Gate Q Kconfig derivation v0.8\\n\\nIndependently audit the canonical v0.8 ZIP and manifest. Verify the ZIP digest, every REMOTE_FILES.sha256 entry, fixed source commit/tree/baseline, qualified OCI/toolchain binding, all 760 module inputs including the eight lowercase-x symbols, K0/K1 normalization and second-run byte identity, and absence of kernel objects/outputs.\\n\\nReassess v0.7 MAJOR #1 using PAHOLE_GCC_CAPABILITY_EVIDENCE.json, PAHOLE_BTF_NORMALIZED_ASSERTIONS.json, NORMALIZATION_COMMANDS.json, configs and logs. Confirm same-environment /usr/bin/pahole v1.25, scripts/pahole-version.sh=125, explicit PAHOLE=/usr/bin/pahole binding, and normalized CONFIG_PAHOLE_VERSION=125 plus recorded BTF symbols. Reassess GCC plugin MINOR using measured header/package-lock evidence without assuming intent. Preserve the closed v0.7 outer-ZIP hash finding and review semantic deltas including MD_AUTODETECT=y.\\n\\nReturn PASS/FAIL and CRITICAL/MAJOR/MINOR/NOTE counts. Do not authorize Gate A, Stage 0B runtime, production, Docker runtime, privileged initialization, or kernel runtime. Gate Q remains HOLD pending Fresh Independent Re-Audit and Human Owner acceptance."
          (ev/'README_V08.md').write_text(readme)
          (ev/'FRESH_INDEPENDENT_REAUDIT_PROMPT_V08.md').write_text(prompt)
          files=[p for p in sorted(ev.rglob('*')) if p.is_file() and p.name!='REMOTE_FILES.sha256']
          (ev/'REMOTE_FILES.sha256').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.relative_to(ev).as_posix()+'\\n' for p in files))
          canonical=Path('/tmp/gateq-kconfig-derivation-v08.zip')
          with zipfile.ZipFile(canonical,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(ev.rglob('*')):
                  if p.is_file():
                      z.write(p,p.relative_to(ev).as_posix())
          manifest={'schema_version':1,'project':'Gate Q Kconfig derivation v0.8','artifact':'gateq-kconfig-derivation-v08.zip','artifact_sha256':hashlib.sha256(canonical.read_bytes()).hexdigest(),'artifact_size':canonical.stat().st_size,'source_commit':'14794180686c2fb6307fbe359c359bec765249f3','source_tree':'3b5ec33f7fd60f23d01064150f7c7020d2e6af99','result':'STATIC_DERIVATION_ONLY_PENDING_FRESH_INDEPENDENT_REAUDIT','Gate_Q':'HOLD','kernel_build_authorized':False,'runtime_authorized':False,'Docker_executed':False,'Buildah_executed':False,'privileged_initializer_executed':False}
          Path('/tmp/CANONICAL_ARTIFACT_MANIFEST_V08.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\\n')
          print('CANONICAL_V08_SHA256 '+manifest['artifact_sha256'])
          PY_PACKET
      - name: Upload canonical v0.8 re-audit packet
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateq-kconfig-derivation-v08-canonical
          path: |
            /tmp/gateq-kconfig-derivation-v08.zip
            /tmp/CANONICAL_ARTIFACT_MANIFEST_V08.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Upload config derivation evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateq-kconfig-derivation-v08
          path: /tmp/gateq-kconfig-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
