# EXPERIMENTAL: synthetic fixtures only; never a required Gate Q check.
# No live Gate Q artifacts, signatures, credentials, or real runtime paths.
name: Gate Q synthetic v0.4 (NON-REQUIRED)
on:
  pull_request:
    branches: [main]
    paths:
      - "experiments/gateq-synthetic-ci-v0.4/**"
      - ".github/workflows/gateq-synthetic-v04.yml"
permissions:
  contents: read
concurrency:
  group: gateq-synthetic-v04-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-fixture-tests-not-required:
    name: synthetic-fixture-tests-NOT-REQUIRED
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Run disposable synthetic-only tests
        run: python -m unittest discover -v -s experiments/gateq-synthetic-ci-v0.4 -p 'test_*.py'
