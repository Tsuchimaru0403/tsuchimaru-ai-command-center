name: Gate Q v0.7 Derivation Evidence Inspect

on:
  push:
    branches: [gateq-kconfig-derivation-v07-20261003]
    paths: [.github/workflows/gateq-v07-derivation-inspect.yml]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Download successful corrected derivation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gateq-kconfig-derivation-v07
          path: /tmp/evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37116020695

      - name: Verify and summarize corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          ev=Path('/tmp/evidence')
          def sha(p):
              with open(p,'rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
          def parse(p):
              out={}
              for line in p.read_text().splitlines():
                  m=re.match(r'^(CONFIG_[A-Za-z0-9_]+)=(.*)$',line)
                  if m: out[m.group(1)]=m.group(2); continue
                  m=re.match(r'^# (CONFIG_[A-Za-z0-9_]+) is not set$',line)
                  if m: out[m.group(1)]='n'
              return out
          base=parse(ev/'K0_BASELINE.config')
          pre=parse(ev/'K1_PRE_OLDDEFCONFIG.config')
          post=parse(ev/'K1_POST_OLDDEFCONFIG.config')
          base_m=sorted(k for k,v in base.items() if v=='m')
          pre_m=sorted(k for k,v in pre.items() if v=='m')
          post_m=sorted(k for k,v in post.items() if v=='m')
          diff=sorted(k for k in set(pre)|set(post) if pre.get(k,'<absent>')!=post.get(k,'<absent>'))
          missed=[
            'CONFIG_MT76x02_LIB','CONFIG_MT76x02_USB','CONFIG_MT792x_LIB','CONFIG_MT792x_USB',
            'CONFIG_MT76x0_COMMON','CONFIG_MT76x0U','CONFIG_MT76x2_COMMON','CONFIG_MT76x2U'
          ]
          summary={
            'status':'PASS_STATIC_CORRECTED_DERIVATION_INSPECTION',
            'source_commit':'14794180686c2fb6307fbe359c359bec765249f3',
            'source_tree':'3b5ec33f7fd60f23d01064150f7c7020d2e6af99',
            'baseline_sha256':sha(ev/'K0_BASELINE.config'),
            'baseline_raw_module_entries':len(base_m),
            'v06_uppercase_regex_entries':752,
            'v06_regex_gap_count':8,
            'v06_missed_symbols':missed,
            'pre_sha256':sha(ev/'K1_PRE_OLDDEFCONFIG.config'),
            'pre_module_entries':len(pre_m),
            'post_sha256':sha(ev/'K1_POST_OLDDEFCONFIG.config'),
            'post_module_entries':len(post_m),
            'pre_post_semantic_delta_count':len(diff),
            'pre_post_delta_symbols':diff,
            'post_equals_v06_final_hash':sha(ev/'K1_POST_OLDDEFCONFIG.config')=='7415e92062b1fe82232e50e2d483f955c4fd80a3794e1a39191a7dc12d00f405',
            'normalization_result':json.loads((ev/'NORMALIZATION_RESULT.json').read_text()),
            'regex_gap_evidence':json.loads((ev/'V06_REGEX_GAP_REMEDIATION.json').read_text()),
            'Gate_Q':'HOLD',
            'kernel_build_authorized':False,
            'runtime_authorized':False
          }
          assert summary['baseline_raw_module_entries']==760
          assert summary['v06_regex_gap_count']==8
          assert summary['pre_module_entries']==0
          assert summary['post_module_entries']==0
          assert summary['normalization_result']['K1']['second_normalization_byte_identical'] is True
          assert summary['normalization_result']['K1']['kernel_outputs']==[]
          (ev/'CORRECTED_DERIVATION_SUMMARY_V07.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload compact corrected summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateq-kconfig-derivation-v07-summary
          path: /tmp/evidence/CORRECTED_DERIVATION_SUMMARY_V07.json
          if-no-files-found: error
          retention-days: 30
